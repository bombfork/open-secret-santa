name: Android E2E (Maestro)

# Runs the Maestro deep-link and smoke flows against the debug APK on an
# emulator. Catches intent-delivery/Capacitor-layer regressions; it does NOT
# exercise real App Links verification (links are force-approved — debug
# builds can never pass assetlinks.json verification). See TESTING_E2E.md.
#
# Cost control: path filters keep this off docs-only changes. To cut cost
# further, replace the pull_request trigger with push-to-main only — the
# workflow_dispatch trigger stays available for on-demand runs.

on:
  pull_request:
    branches:
      - main
    paths:
      - "js/**"
      - "index.html"
      - "locales/**"
      - "android/**"
      - "capacitor.config.json"
      - "e2e/**"
      - ".github/workflows/android-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "js/**"
      - "index.html"
      - "locales/**"
      - "android/**"
      - "capacitor.config.json"
      - "e2e/**"
      - ".github/workflows/android-e2e.yml"
  workflow_dispatch:

env:
  API_LEVEL: 34
  MAESTRO_VERSION: "2.11.0" # pin; bump deliberately (webview reading changed across versions)

jobs:
  e2e:
    name: Maestro E2E on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: npm run cap:sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # actions/cache only saves on job success, so a failing e2e run would
      # rebuild the AVD forever — split restore/save and save explicitly
      # before the flows run.
      - name: Restore AVD cache
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-${{ env.API_LEVEL }}-google-apis-x86_64-v1

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching"

      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-${{ env.API_LEVEL }}-google-apis-x86_64-v1

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_SKIP_BUILD: "1"
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash e2e/run.sh

      - name: Upload e2e output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ github.sha }}
          path: |
            e2e/output/
            /home/runner/.maestro/tests/
          retention-days: 14
