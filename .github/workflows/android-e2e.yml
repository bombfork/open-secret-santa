name: Android E2E (Maestro)

# Runs the Maestro deep-link and smoke flows against the debug APK on an
# emulator. Catches intent-delivery/Capacitor-layer regressions; it does NOT
# exercise real App Links verification (links are force-approved — debug
# builds can never pass assetlinks.json verification). See TESTING_E2E.md.
#
# Runs on every PR (no path filter) so it can be a required check — a check
# skipped by path filtering never reports and would block merging. Pushes to
# main keep the path filter: the PR run already covered the merge commit's
# content, so docs-only merges skip the ~7 min emulator job.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "js/**"
      - "index.html"
      - "locales/**"
      - "android/**"
      - "capacitor.config.json"
      - "e2e/**"
      - ".github/workflows/android-e2e.yml"
  workflow_dispatch:

# A newer push to the same branch/PR supersedes any in-flight e2e run
concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: 34
  # Runner's preinstalled SDK; mise-action exports the dev-machine ANDROID_HOME
  # from .mise.toml, which must be overridden back (see the repoint step)
  RUNNER_SDK: /usr/local/lib/android/sdk

jobs:
  e2e:
    name: Maestro E2E on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installs node, java, and the pinned Maestro from .mise.toml, with the
      # tool installs cached on the .mise.toml hash
      - name: Setup mise tools (node, java, maestro — cached)
        uses: jdx/mise-action@v2

      # mise puts java on PATH but gradle resolves the JDK via JAVA_HOME,
      # which still points at the runner's default JDK — export mise's
      - name: Align toolchain env (JAVA_HOME, Android SDK)
        run: |
          {
            echo "JAVA_HOME=$(mise where java)"
            echo "ANDROID_HOME=$RUNNER_SDK"
            echo "ANDROID_SDK_ROOT=$RUNNER_SDK"
          } >> "$GITHUB_ENV"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync Capacitor
        run: npm run cap:sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # actions/cache only saves on job success, so a failing e2e run would
      # rebuild the AVD and re-download the system image forever — split
      # restore/save and save explicitly before the flows run.
      - name: Restore AVD cache
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-${{ env.API_LEVEL }}-google-apis-x86_64-pixel5-v2

      - name: Restore Android system image cache
        uses: actions/cache/restore@v4
        id: sysimg-cache
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: sysimg-api-${{ env.API_LEVEL }}-google-apis-x86_64-v1

      - name: Create AVD snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching"

      - name: Save AVD cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-${{ env.API_LEVEL }}-google-apis-x86_64-pixel5-v2

      - name: Save Android system image cache
        if: steps.sysimg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: sysimg-api-${{ env.API_LEVEL }}-google-apis-x86_64-v1

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_SKIP_BUILD: "1"
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash e2e/run.sh

      - name: Upload e2e output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output-${{ github.sha }}
          path: |
            e2e/output/
            /home/runner/.maestro/tests/
          retention-days: 14
