name: Lint, Format, and Validate

on:
  # Trigger on pull requests targeting main branch
  pull_request:
    branches:
      - main

  # Keep the main-branch badge/history current
  push:
    branches:
      - main

  # Allow manual trigger
  workflow_dispatch:

jobs:
  lint-format-validate:
    name: Lint, Format & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup mise tools (node, cached)
        uses: jdx/mise-action@v2

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Check code formatting with oxfmt
        run: npm run format

      - name: Validate i18n JSON files against schema
        run: npm run validate:i18n

      - name: Summary
        if: success()
        run: |
          echo "✅ All checks passed!"
          echo "- oxlint: Code is properly linted"
          echo "- oxfmt: Code is properly formatted"
          echo "- i18n: All locale files comply with schema"
