[tools]
"github:mobile-dev-inc/maestro" = "latest"
java = "zulu-21"
jq = "latest"
node = "latest"

[env]
ANDROID_HOME = "{{env.HOME}}/Android/Sdk"
ANDROID_SDK_ROOT = "{{env.HOME}}/Android/Sdk"
_.path = [
  "{{env.HOME}}/Android/Sdk/platform-tools",
  "{{env.HOME}}/Android/Sdk/emulator",
  "{{env.HOME}}/Android/Sdk/cmdline-tools/latest/bin",
]

[tasks.dev]
description = "Start local development server"
run = """
echo "Starting server on http://localhost:8000"
trap 'echo "\nServer stopped"; exit 0' SIGINT
npx http-server -p 8000
"""

[tasks.test]
description = "Open the application in browser after starting server"
run = """
echo "Starting server on http://localhost:8000"
trap 'kill $SERVER_PID 2>/dev/null; echo "\nServer stopped"; exit 0' SIGINT
npx http-server -p 8000 --silent &
SERVER_PID=$!
echo "Server starting on http://localhost:8000"
sleep 2
if command -v xdg-open > /dev/null; then
  xdg-open http://localhost:8000
elif command -v open > /dev/null; then
  open http://localhost:8000
else
  echo "Please open http://localhost:8000 in your browser"
fi
echo "Press Ctrl+C to stop the server"
wait $SERVER_PID
"""

[tasks.lint]
description = "Run ESLint on JavaScript files"
run = "npm run lint"

[tasks.format]
description = "Check code formatting with Prettier"
run = "npm run format"

[tasks.format-fix]
description = "Fix code formatting with Prettier"
run = "npm run format:fix"

[tasks.validate-i18n]
description = "Validate i18n JSON files against schema"
run = "npm run validate:i18n"

[tasks.test-unit]
description = "Run unit tests for the assignment algorithm"
run = "npm run test:unit"

[tasks.validate-all]
description = "Run all validation checks (lint, format, i18n, unit tests)"
run = "npm run validate:all"

[tasks.icons]
description = "Regenerate all Android icon/splash assets from the pixel-art master (scripts/generate-icons.mjs)"
run = "node scripts/generate-icons.mjs"

[tasks.e2e-build]
description = "Build debug APK for e2e tests (web assets + cap sync + gradle)"
run = """
npm run cap:sync
cd android && ./gradlew assembleDebug
"""

[tasks.e2e]
description = "Run all Maestro e2e flows against the connected adb device/emulator"
run = "bash e2e/run.sh"

[tasks.emulator-start]
description = "Boot the e2e Android emulator headless and wait for full boot (default AVD: e2e-api34; set EMULATOR_WINDOW=1 for a visible window)"
run = """
AVD="{{arg(name="avd", default="e2e-api34")}}"
if [ "$(adb get-state 2>/dev/null)" = "device" ]; then
  echo "A device is already connected:"
  adb devices
  exit 0
fi
WINDOW_ARGS="-no-window -gpu swiftshader_indirect"
[ -n "${EMULATOR_WINDOW:-}" ] && WINDOW_ARGS=""
echo "Booting AVD $AVD..."
nohup emulator -avd "$AVD" $WINDOW_ARGS -no-audio -no-boot-anim \
  > /tmp/emulator-$AVD.log 2>&1 &
adb wait-for-device shell 'while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 2; done'
echo "Emulator booted (log: /tmp/emulator-$AVD.log)"
"""

[tasks.emulator-stop]
description = "Shut down the running Android emulator"
run = "adb emu kill"

[tasks.emulator-list]
description = "List available AVDs and connected devices"
run = """
echo "AVDs:"
emulator -list-avds
echo
echo "Connected:"
adb devices
"""

[tasks.e2e-flow]
description = "Run a single e2e flow by name, e.g.: mise run e2e-flow 01-cold-start-participant"
run = 'bash e2e/run.sh {{arg(name="flow")}}'
