# Plain launch with no deep link: getLaunchDeepLink() returning null must not
# break normal routing — the landing page must show.
appId: com.bombfork.opensecretsanta
tags:
  - regression
  - deeplink
---
# Separate steps, not bundled launchApp{clearState,stopApp}: the bundled form
# launches inside AM's 1s remove-task destroy timeout and the fresh process
# gets killed (see TESTING_E2E.md)
- clearState
- stopApp
- extendedWaitUntil:
    visible: "NEVER_PRESENT_SLEEP_2000MS"
    timeout: 2000
    optional: true
- launchApp
# landing anchor: the landing buttons sit below the fold on small screens
- extendedWaitUntil:
    visible: "How it works"
    timeout: 30000
- assertNotVisible: "You are Secret Santa for:"
- takeScreenshot: e2e/output/04-plain-launch
