# Offline operation (issue #14 critical test): with airplane mode on, the app
# must serve its bundled assets, run the full create flow, and resolve deep
# links locally — no network involved at any point.
appId: com.bombfork.opensecretasanta
tags:
  - regression
---
- setAirplaneMode: enabled

# Cold start fully offline
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "How it works"
    timeout: 30000

# Create flow offline (same steps as 90-smoke-create)
- swipe:
    direction: UP
- swipe:
    direction: UP
- extendedWaitUntil:
    visible: "Create New Secret Santa"
    timeout: 5000
- tapOn: "Create New Secret Santa"
- extendedWaitUntil:
    visible: "Participant Names.*"
    timeout: 5000
- tapOn:
    id: "participants"
- inputText: "Alice"
- pressKey: Enter
- inputText: "Bob"
- pressKey: Enter
- inputText: "Charlie"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Generate Secret Santa"
    direction: DOWN
- tapOn: "Generate Secret Santa"
- extendedWaitUntil:
    visible: "Secret Santa Created!"
    timeout: 10000

# Deep link resolved locally while still offline
- stopApp
- openLink:
    link: ${PARTICIPANT_URL}
    autoVerify: true
- extendedWaitUntil:
    visible: "You are Secret Santa for:"
    timeout: 30000
- assertVisible: ${RECEIVER_NAME}
- takeScreenshot: e2e/output/08-offline

- setAirplaneMode: disabled
