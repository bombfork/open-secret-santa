# Warm-start deep link: process alive and idle on the landing page, so the
# link must arrive via onNewIntent (launchMode singleTask) -> Capacitor
# appUrlOpen -> initDeepLinking listener (js/main.js).
appId: com.bombfork.opensecretasanta
androidWebViewHierarchy: devtools
tags:
  - regression
  - deeplink
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "Create New Secret Santa"
    timeout: 15000
- openLink:
    link: ${PARTICIPANT_URL}
    autoVerify: true
- extendedWaitUntil:
    visible: "You are Secret Santa for:"
    timeout: 10000
- assertVisible: ${GIVER_NAME}
- assertVisible: ${RECEIVER_NAME}
- takeScreenshot: e2e/output/03-warm-start
