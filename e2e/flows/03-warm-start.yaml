# Warm-start deep link: process alive and idle on the landing page, so the
# link must arrive via onNewIntent (launchMode singleTask) -> Capacitor
# appUrlOpen -> initDeepLinking listener (js/main.js).
appId: com.bombfork.opensecretasanta
tags:
  - regression
  - deeplink
---
# Clear/stop/start as separate steps: the bundled launchApp
# {clearState, stopApp} races ActivityManager's remove-task destroy timeout
# on slow emulators — the fresh process gets killed ("start not valid") and
# the app window stays blank
- clearState
- stopApp
# Bounded settle so AM finishes removing the old task before the fresh start
# (Maestro idiom: optional wait on a never-present element)
- extendedWaitUntil:
    visible: "NEVER_PRESENT_SLEEP_2000MS"
    timeout: 2000
    optional: true
- launchApp
# landing anchor: the landing buttons sit below the fold on small screens
- extendedWaitUntil:
    visible: "How it works"
    timeout: 30000
- openLink:
    link: ${PARTICIPANT_URL}
    autoVerify: true
- extendedWaitUntil:
    visible: "You are Secret Santa for:"
    timeout: 15000
- assertVisible: ${GIVER_NAME}
- assertVisible: ${RECEIVER_NAME}
- takeScreenshot: e2e/output/03-warm-start
