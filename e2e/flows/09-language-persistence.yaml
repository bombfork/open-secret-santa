# Language persistence (issue #14): switching language must survive an app
# restart via localStorage. The webview <select> opens Android's native option
# dialog, so the option is tapped by its visible text.
appId: com.bombfork.opensecretsanta
tags:
  - regression
---
# Separate steps + settle instead of bundled launchApp{clearState,stopApp}:
# AM's 1s remove-task destroy timeout kills a too-early launch (TESTING_E2E.md)
- clearState
- stopApp
- extendedWaitUntil:
    visible: "NEVER_PRESENT_SLEEP_2000MS"
    timeout: 2000
    optional: true
- launchApp
- extendedWaitUntil:
    visible: "How it works"
    timeout: 30000
# Option text is "🇫🇷 Français" — Maestro matches the full string, so regex
- tapOn:
    id: "language-select"
- extendedWaitUntil:
    visible: ".*Français.*"
    timeout: 5000
- tapOn: ".*Français.*"
# i18n swap re-renders the whole page via JS — slower than a normal paint
- extendedWaitUntil:
    visible: "Comment ça marche"
    timeout: 10000

# Restart without clearing state: the choice must persist
- stopApp
# stopApp alone also tears the task down — settle before relaunching
- extendedWaitUntil:
    visible: "NEVER_PRESENT_SLEEP_2000MS"
    timeout: 2000
    optional: true
- launchApp
- extendedWaitUntil:
    visible: "Comment ça marche"
    timeout: 15000
- takeScreenshot: e2e/output/09-language-persistence
