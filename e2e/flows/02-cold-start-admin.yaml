# Cold-start deep link to the admin view, then unlock with the password.
appId: com.bombfork.opensecretasanta
tags:
  - regression
  - deeplink
---
- clearState
- stopApp
- openLink:
    link: ${ADMIN_URL}
    autoVerify: true
- extendedWaitUntil:
    visible: "Enter Admin Password"
    timeout: 15000
- assertVisible: "Participant Links"
- assertVisible: "View All Assignments"
- tapOn:
    id: "admin-password-input"
- inputText: ${ADMIN_PASSWORD}
- hideKeyboard
- tapOn: "View All Assignments"
- extendedWaitUntil:
    visible: "All Secret Santa Assignments"
    timeout: 5000
- assertVisible: ${RECEIVER_NAME}
- takeScreenshot: e2e/output/02-cold-start-admin
