# Landing buttons after deep-link entry: when the app starts via a deep link,
# init() must still wire the landing page buttons and the create form. Symptom
# of the regression: tap "Back to Home" from the assignment view, landing shows,
# but "Create New Secret Santa" / "View Your Assignment" do nothing.
appId: com.bombfork.opensecretsanta
tags:
  - regression
  - deeplink
---
- clearState
- stopApp
# Settle past AM's 1s remove-task destroy timeout (see TESTING_E2E.md)
- extendedWaitUntil:
    visible: "NEVER_PRESENT_SLEEP_2000MS"
    timeout: 2000
    optional: true
- openLink:
    link: ${PARTICIPANT_URL}
    autoVerify: true
- extendedWaitUntil:
    visible: "You are Secret Santa for:"
    timeout: 30000
- tapOn: "Back to Home"
# "How it works" anchors the landing (buttons are below the fold)
- extendedWaitUntil:
    visible: "How it works"
    timeout: 5000
- swipe:
    direction: UP
# Chromium exposes HTML ids as resource-ids
- tapOn:
    id: "create-btn"
# Create page anchor (en.json create.participantsLabel) — only reachable if the
# landing button listener was attached on the deep-link entry path. Regex:
# label text includes the nested help text
- extendedWaitUntil:
    visible: "Participant Names.*"
    timeout: 5000
- takeScreenshot: e2e/output/06-back-home-landing-buttons
