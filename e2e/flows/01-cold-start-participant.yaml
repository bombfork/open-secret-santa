# Cold-start deep link delivery (the PR #29 / issue #23 regression target).
# The link must arrive as the launch intent of a fresh process and reach the
# router through Capacitor App.getLaunchUrl() (js/deeplink.js getLaunchDeepLink),
# NOT through the warm-start appUrlOpen listener.
appId: com.bombfork.opensecretasanta
androidWebViewHierarchy: devtools
tags:
  - regression
  - deeplink
---
# Variant A: fresh install state, process never started
- clearState
- stopApp
- openLink:
    link: ${PARTICIPANT_URL}
    autoVerify: true
- extendedWaitUntil:
    visible: "You are Secret Santa for:"
    timeout: 15000
- assertVisible: ${GIVER_NAME}
- assertVisible: ${RECEIVER_NAME}
- takeScreenshot: e2e/output/01-cold-start-participant-fresh

# Variant B: issue #23 shape — app opened before, process killed, link tapped
- launchApp:
    clearState: true
    stopApp: true
- assertVisible: "Create New Secret Santa"
- stopApp
- openLink:
    link: ${PARTICIPANT_URL}
    autoVerify: true
- extendedWaitUntil:
    visible: ${RECEIVER_NAME}
    timeout: 15000
- takeScreenshot: e2e/output/01-cold-start-participant-recents
