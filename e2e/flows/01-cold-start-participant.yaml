# Cold-start deep link delivery (the PR #29 / issue #23 regression target).
# The link must arrive as the launch intent of a fresh process and reach the
# router through Capacitor App.getLaunchUrl() (js/deeplink.js getLaunchDeepLink),
# NOT through the warm-start appUrlOpen listener.
appId: com.bombfork.opensecretsanta
tags:
  - regression
  - deeplink
---
# Variant A: fresh install state, process never started
- clearState
- stopApp
# Settle ≥2s: clearState/stopApp schedule the old task's removal with AM's
# fixed 1s destroy timeout; a launch landing inside that window gets the
# fresh process killed ("remove task" → "failed to attach") at any emulator
# speed — faster dispatch hits it more. 2s is past the window by design.
- extendedWaitUntil:
    visible: "NEVER_PRESENT_SLEEP_2000MS"
    timeout: 2000
    optional: true
- openLink:
    link: ${PARTICIPANT_URL}
    autoVerify: true
- extendedWaitUntil:
    visible: "You are Secret Santa for:"
    timeout: 30000
- assertVisible: ${GIVER_NAME}
- assertVisible: ${RECEIVER_NAME}
- takeScreenshot: e2e/output/01-cold-start-participant-fresh

# Variant B: issue #23 shape — app opened before, process killed, link tapped
# ("How it works" anchors the landing page: the landing buttons sit below the
# fold on small screens and assertVisible only sees the viewport)
# Clear/stop/settle/start as separate steps — see variant A for the settle
- clearState
- stopApp
- extendedWaitUntil:
    visible: "NEVER_PRESENT_SLEEP_2000MS"
    timeout: 2000
    optional: true
- launchApp
- extendedWaitUntil:
    visible: "How it works"
    timeout: 15000
- stopApp
# stopApp alone also tears the task down — same settle before relaunching
- extendedWaitUntil:
    visible: "NEVER_PRESENT_SLEEP_2000MS"
    timeout: 2000
    optional: true
- openLink:
    link: ${PARTICIPANT_URL}
    autoVerify: true
- extendedWaitUntil:
    visible: ${RECEIVER_NAME}
    timeout: 30000
- takeScreenshot: e2e/output/01-cold-start-participant-recents
